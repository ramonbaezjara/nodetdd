name: ci
on:
  push:
    #Ejecutar el ci cuando se haga push en estas ramas
    branches: [develop]
  pull_request:
    #Ejecutar el ci cuando se haga PR en estas ramas
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps (lockfile)
        run: npm ci

      - name: Run tests
        run: npm run test
